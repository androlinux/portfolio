<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Abstract decoration -->
  <circle cx="1000" cy="150" r="300" fill="#ffffff" opacity="0.03" />
  <circle cx="1100" cy="500" r="200" fill="#ffffff" opacity="0.02" />
  
  <text x="120" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="90" fill="#ffffff" letter-spacing="-2">Myrat Daniyarov</text>
  <text x="120" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="42" fill="#94a3b8">Project Manager Assistant &amp; Digital Creator</text>
  
  <!-- CTA Button -->
  <rect x="120" y="440" width="300" height="80" rx="40" fill="url(#btn)"/>
  <text x="270" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle">View Portfolio</text>
</svg>
